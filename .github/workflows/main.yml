on:
  push:
    branches:
    - main
  pull_request:
    branches:
    - main
  workflow_dispatch:
  schedule:
    - cron: 0 2 * * *

permissions:
  contents: read

name: Main
jobs:
  linux:
    name: linux ${{matrix.quantum}}${{matrix.openmp_flag}} (${{matrix.architecture}})
    runs-on: ubuntu-24.04
    container:
      image: ubuntu:20.04

    strategy:
      fail-fast: false
      matrix:
        architecture: [ x64, arm64 ]
        quantum: [ Q8, Q16, Q16-HDRI ]
        openmp: [ noOpenMP, OpenMP ]
        include:
          - openmp: OpenMP
            openmp_flag: -OpenMP

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 #v7.0.1
        with:
          persist-credentials: false

      - name: Install build tools
        run: ./install.build-tools.sh
        working-directory: build/linux-${{matrix.architecture}}

      - name: Update ImageMagick.commit to latest commit
        run: ./update.imagemagick.sh
        if: github.event_name == 'schedule'
        working-directory: src/ImageMagick

      - name: Clone ImageMagick libraries
        run: ./checkout.sh --no-configure --dependencies-artifact linux-${{matrix.architecture}}-static.zip
        working-directory: src/ImageMagick

      - name: Build ImageMagick
        run: ../../../build/shared/build.imagemagick.sh linux ${{matrix.architecture}} ${{matrix.quantum}} ${{matrix.openmp}}
        working-directory: src/ImageMagick/ImageMagick

      - name: Build Native
        run: ../../build/shared/build.native.sh linux ${{matrix.architecture}} ${{matrix.quantum}} ${{matrix.openmp}}
        working-directory: src/Magick.Native

      - name: Copy Native
        run: ../../build/shared/copy.native.sh ../../artifacts linux ${{matrix.architecture}} ${{matrix.quantum}} ${{matrix.openmp}}
        working-directory: src/Magick.Native

      - name: Upload library
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 #v7.0.2
        with:
          name: linux-${{matrix.quantum}}-${{matrix.architecture}}${{matrix.openmp_flag}}
          path: artifacts

  linux-musl:
    name: linux musl ${{matrix.quantum}}${{matrix.openmp_flag}} (${{matrix.architecture}})
    runs-on: ubuntu-24.04
    container:
      image: alpine:3.21

    strategy:
      fail-fast: false
      matrix:
        architecture: [ x64 ]
        quantum: [ Q8, Q16, Q16-HDRI ]
        openmp: [ noOpenMP, OpenMP ]
        include:
          - openmp: OpenMP
            openmp_flag: -OpenMP

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 #v7.0.1
        with:
          persist-credentials: false

      - name: Install build tools
        run: ./install.build-tools.sh
        working-directory: build/linux-musl-${{matrix.architecture}}

      - name: Update ImageMagick.commit to latest commit
        run: ./update.imagemagick.sh
        if: github.event_name == 'schedule'
        working-directory: src/ImageMagick

      - name: Clone ImageMagick libraries
        run: ./checkout.sh --no-configure --dependencies-artifact linux-musl-${{matrix.architecture}}-static.zip
        working-directory: src/ImageMagick

      - name: Build ImageMagick
        run: ../../../build/shared/build.imagemagick.sh linux-musl ${{matrix.architecture}} ${{matrix.quantum}} ${{matrix.openmp}}
        working-directory: src/ImageMagick/ImageMagick

      - name: Build Native
        run: ../../build/shared/build.native.sh linux-musl ${{matrix.architecture}} ${{matrix.quantum}} ${{matrix.openmp}}
        working-directory: src/Magick.Native

      - name: Copy Native
        run: ../../build/shared/copy.native.sh ../../artifacts linux-musl ${{matrix.architecture}} ${{matrix.quantum}} ${{matrix.openmp}}
        working-directory: src/Magick.Native

      - name: Upload library
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 #v7.0.2
        with:
          name: linux-musl-${{matrix.quantum}}-${{matrix.architecture}}${{matrix.openmp_flag}}
          path: artifacts

  macos:
    name: macOS ${{matrix.quantum}} (arm64)
    runs-on: macos-14

    strategy:
      fail-fast: false
      matrix:
        quantum: [ Q8, Q16, Q16-HDRI ]

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 #v7.0.1
        with:
          persist-credentials: false

      - name: Update ImageMagick.commit to latest commit
        run: ./update.imagemagick.sh
        if: github.event_name == 'schedule'
        working-directory: src/ImageMagick

      - name: Clone ImageMagick libraries
        run: ./checkout.sh --no-configure --dependencies-artifact macos-arm64-static.zip
        working-directory: src/ImageMagick

      - name: Install build tools
        run: ./install.build-tools.sh
        working-directory: build/macos-arm64

      - name: Build ImageMagick
        run: ../../../build/shared/build.imagemagick.sh macos arm64 ${{matrix.quantum}}
        working-directory: src/ImageMagick/ImageMagick

      - name: Build Native
        run: ../../build/shared/build.native.sh macos arm64 ${{matrix.quantum}}
        working-directory: src/Magick.Native

      - name: Copy Native
        run: ../../build/shared/copy.native.sh ../../artifacts macos arm64 ${{matrix.quantum}}
        working-directory: src/Magick.Native

      - name: Upload library
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 #v7.0.2
        with:
          name: macos-${{matrix.quantum}}-arm64
          path: artifacts

  wasm:
    name: wasm (${{matrix.architecture}})
    runs-on: ubuntu-24.04
    container:
      image: emscripten/emsdk:6.0.6

    strategy:
      fail-fast: false
      matrix:
        architecture: [ x64, x86 ]
        quantum: [ Q8 ]

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 #v7.0.1
        with:
          persist-credentials: false

      - name: Update ImageMagick.commit to latest commit
        run: ./update.imagemagick.sh
        if: github.event_name == 'schedule'
        working-directory: src/ImageMagick

      - name: Clone ImageMagick libraries
        run: ./checkout.sh --no-configure --dependencies-artifact wasm-${{matrix.architecture}}-static.zip
        working-directory: src/ImageMagick

      - name: Install build tools
        run: ./install.build-tools.sh
        working-directory: build/wasm-${{matrix.architecture}}

      - name: Build ImageMagick
        run: ../../../build/shared/build.imagemagick.sh wasm ${{matrix.architecture}} ${{matrix.quantum}}
        working-directory: src/ImageMagick/ImageMagick

      - name: Build Native
        run: ../../build/shared/build.native.sh wasm ${{matrix.architecture}} ${{matrix.quantum}}
        working-directory: src/Magick.Native

      - name: Copy Native
        run: ../../build/wasm-${{matrix.architecture}}/copy.native.sh ../../artifacts wasm ${{matrix.architecture}}
        working-directory: src/Magick.Native

      - name: Upload library
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 #v7.0.2
        with:
          name: wasm-${{matrix.quantum}}-${{matrix.architecture}}
          path: artifacts

  windows:
    name: windows ${{matrix.quantum}}${{matrix.hdri_flag}}${{matrix.openmp_flag}} (${{matrix.architecture}})
    runs-on: windows-2025-vs2026

    strategy:
      fail-fast: false
      matrix:
        architecture: [ x86, x64, arm64 ]
        quantum: [ Q8, Q16 ]
        openmp: [ noOpenMP, openMP ]
        hdri: [ noHdri, hdri ]
        exclude:
          - quantum: Q8
            hdri: hdri
          - architecture: x86
            openmp: openMP
        include:
          - hdri: hdri
            hdri_flag: '-HDRI'
          - openmp: openMP
            openmp_flag: '-OpenMP'

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 #v7.0.1
        with:
          persist-credentials: false

      - name: Update ImageMagick.commit to latest commit
        run: ./update.imagemagick.cmd
        if: github.event_name == 'schedule'
        working-directory: src/ImageMagick

      - name: Clone ImageMagick libraries
        shell: cmd
        run: checkout-release.cmd ${{matrix.architecture}} ${{matrix.openmp}}
        working-directory: src/ImageMagick

      - name: Build
        shell: cmd
        run: build.cmd Release ${{matrix.quantum}} ${{matrix.architecture}} ${{matrix.hdri}} ${{matrix.openmp}}
        working-directory: build/windows

      - name: Copy Resources
        shell: cmd
        run: |
          call copy-resources.cmd ..\..\resources-artifacts
        working-directory: build/windows

      - name: Upload resources
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 #v7.0.2
        with:
          name: resources-${{matrix.quantum}}${{matrix.hdri_flag}}-${{matrix.architecture}}${{matrix.openmp_flag}}
          path: resources-artifacts

      - name: Copy Native
        shell: cmd
        run: |
          call copy-native.cmd ..\..\artifacts Release${{matrix.quantum}}${{matrix.hdri_flag}}${{matrix.openmp_flag}} ${{matrix.architecture}}
        working-directory: build/windows

      - name: Upload artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 #v7.0.2
        with:
          name: windows-${{matrix.quantum}}${{matrix.hdri_flag}}-${{matrix.architecture}}${{matrix.openmp_flag}}
          path: artifacts

  verify-linux:
    name: Verify Linux ${{matrix.architecture}} (${{matrix.image}})
    runs-on: ${{matrix.architecture == 'arm64' && 'ubuntu-24.04-arm' || 'ubuntu-24.04'}}
    needs:
      - linux

    strategy:
      fail-fast: false
      matrix:
        include:
          - architecture: x64
            image: ubuntu:20.04
          - architecture: x64
            image: ubuntu:22.04
          - architecture: x64
            image: ubuntu:24.04
          - architecture: x64
            image: tgagor/centos:stream9
          - architecture: x64
            image: mcr.microsoft.com/dotnet/aspnet:latest
          - architecture: x64
            image: mcr.microsoft.com/dotnet/runtime:10.0
          - architecture: x64
            image: public.ecr.aws/lambda/dotnet:latest-x86_64
          - architecture: x64
            image: public.ecr.aws/lambda/dotnet:10-x86_64
          - architecture: arm64
            image: mcr.microsoft.com/dotnet/sdk:10.0-noble-arm64v8
          - architecture: arm64
            image: public.ecr.aws/lambda/dotnet:latest-arm64
          - architecture: arm64
            image: public.ecr.aws/lambda/dotnet:10-arm64

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 #v7.0.1
        with:
          persist-credentials: false

      - name: Download artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 #v8.0.2
        with:
          pattern: linux-Q*-${{matrix.architecture}}*
          merge-multiple: true

      - name: Verify Native
        run: |
          docker run --rm \
            --volume "$GITHUB_WORKSPACE:/workspace" \
            --workdir /workspace \
            --entrypoint /bin/bash \
            "${{matrix.image}}" -ec '
              build/shared/verify.native.sh . linux ${{matrix.architecture}}
              build/shared/verify.native.sh . linux ${{matrix.architecture}} OpenMP
            '

  verify-linux-musl-x64:
    name: Verify Linux musl (x64)
    runs-on: ubuntu-24.04
    needs:
      - linux-musl

    strategy:
      fail-fast: false
      matrix:
        image:
          - alpine:latest
          - mcr.microsoft.com/dotnet/aspnet:10.0-alpine
          - mcr.microsoft.com/dotnet/runtime:10.0-alpine

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 #v7.0.1
        with:
          persist-credentials: false

      - name: Download artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 #v8.0.2
        with:
          pattern: linux-musl-Q*-x64*
          merge-multiple: true

      - name: Verify Native
        run: |
          docker run --rm \
            --volume "$GITHUB_WORKSPACE:/workspace" \
            --workdir /workspace \
            --entrypoint /bin/sh \
            "${{matrix.image}}" -ec '
              apk add --no-cache bash
              build/shared/verify.native.sh . linux-musl x64
              build/shared/verify.native.sh . linux-musl x64 OpenMP
            '

  verify-macos:
    name: Verify MacOS arm64 (${{matrix.os}})
    runs-on: ${{matrix.os}}
    needs:
      - macos

    strategy:
      fail-fast: false
      matrix:
        os: [ macos-14, macos-15, macos-26 ]

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 #v7.0.1
        with:
          persist-credentials: false

      - name: Download artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 #v8.0.2
        with:
          pattern: macos-Q*-arm64
          merge-multiple: true

      - name: Verify MacOS
        run: build/shared/verify.native.macos.sh . macos arm64

  metadata:
    name: Metadata
    runs-on: ubuntu-24.04
    needs:
      - verify-linux
      - verify-linux-musl-x64
      - verify-macos
      - wasm
      - windows
    outputs:
      version: ${{steps.set-version.outputs.version}}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 #v7.0.1
        with:
          persist-credentials: false

      - name: Download artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 #v8.0.2
        with:
          name: windows-Q16-HDRI-x64

      - name: Set version
        id: set-version
        run: echo "version=$(date +'%Y.%-m%d.%-H%M')" >> $GITHUB_OUTPUT

      - name: Copy NOTICE.txt and create libraries.md
        run: |
          commit=$(git rev-parse HEAD)

          mkdir -p artifacts
          cd artifacts

          echo "# Libraries" >> libraries.md
          echo "Magick.Native [$commit](https://github.com/dlemstra/Magick.Native/commit/$commit) is build with the following libraries:" >> libraries.md
          echo "" >> libraries.md
          sed -n 's/^\[ \(.*\) \]/- \1/p' ../NOTICE.txt >> libraries.md

      - name: Upload metadata
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 #v7.0.2
        with:
          name: metadata
          path: artifacts

  publish-release:
    name: Publish release
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    needs:
      - metadata

    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 #v7.0.1

      - name: Download artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 #v8.0.2
        with:
          path: artifacts
          skip-decompress: true

      - name: Create and push tag
        env:
          VERSION: ${{needs.metadata.outputs.version}}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag $VERSION
          git push origin $VERSION

      - name: Publish release
        env:
          GH_TOKEN: ${{github.token}}
          VERSION: ${{needs.metadata.outputs.version}}
        run: |
          gh release create "$VERSION" \
            --title "$VERSION" \
            --notes "$VERSION" \
            ${{github.workspace}}/artifacts/**/*.zip \

  publish-wasm-x86:
    name: Publish wasm library
    runs-on: ubuntu-24.04
    needs:
      - metadata

    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 #v7.0.1
        with:
          persist-credentials: false

      - name: Download wasm library
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 #v8.0.2
        with:
          name: wasm-Q8-x64
          path: publish/wasm/files/x64

      - name: Download wasm library
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 #v8.0.2
        with:
          name: wasm-Q8-x86
          path: publish/wasm/files/x86

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 #v7.1.0
        with:
          node-version: 26
          registry-url: https://npm.pkg.github.com
          scope: '@dlemstra'

      - name: Create wasm files
        run: |
          npm install
          npm run build
          npm run create-wasm-files
        working-directory: src/wasm-file-creator

      - name: Create NPM package
        env:
          VERSION: ${{needs.metadata.outputs.version}}
        run: ./publish.sh --version $VERSION
        working-directory: publish/wasm

      - name: Publish NPM package
        if: github.event_name == 'workflow_dispatch'
        run: npm publish
        working-directory: publish/wasm/files
        env:
          NODE_AUTH_TOKEN: ${{secrets.GITHUB_TOKEN}}
